# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Files younger than this may still be written by a worker and are never pruned.
    # Keep it above the yt-dlp process timeout (yt_dlp.timeout, 300 s by default).
    app.downloads.orphan_ttl_seconds: 3600

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\DataFixtures\:
        resource: '../fixtures/'

    # Service and repository interfaces are the seams the application depends on.
    App\Service\VideoProcessorInterface:
        alias: App\Service\VideoDownloaderService
    App\Service\DownloadDispatcherInterface:
        alias: App\Service\DownloadDispatcher
    App\Service\DownloadIntakePolicyInterface:
        alias: App\Service\DownloadIntakePolicy
    App\Service\QueueStatsServiceInterface:
        alias: App\Service\QueueStatsService
    App\Service\OrphanFilePrunerInterface:
        alias: App\Service\OrphanFilePruner
    App\Service\LibraryPrunerInterface:
        alias: App\Service\LibraryPruner
    App\Service\QueuePurgeServiceInterface:
        alias: App\Service\QueuePurgeService
    App\Service\QueueResetServiceInterface:
        alias: App\Service\QueueResetService
    App\Service\DownloadTaskManagerInterface:
        alias: App\Service\DownloadTaskManager
    App\Service\SourceManagerInterface:
        alias: App\Service\SourceManager
    App\Service\LogManagerInterface:
        alias: App\Service\LogManager
    App\Service\DownloadMetricManagerInterface:
        alias: App\Service\DownloadMetricManager
    App\Service\TelegramClientInterface:
        alias: App\Service\TelegramClient
    App\Service\TelegramNotifierInterface:
        alias: App\Service\TelegramNotifier
    App\Service\TelegramUpdateHandlerInterface:
        alias: App\Service\TelegramUpdateHandler
    App\Service\YoutubeDlProbeInterface:
        alias: App\Service\YoutubeDlProbe
    App\Service\RefreshTokenManagerInterface:
        alias: App\Service\RefreshTokenManager
    App\Service\FormatResolverInterface:
        alias: App\Service\FormatResolver
    App\Service\YoutubeDlWrapperInterface:
        alias: App\Service\YoutubeDlWrapper
    App\Repository\SourceRepositoryInterface:
        alias: App\Repository\SourceRepository
    App\Repository\UserRepositoryInterface:
        alias: App\Repository\UserRepository
    App\Repository\DownloadTaskRepositoryInterface:
        alias: App\Repository\DownloadTaskRepository
    App\Repository\DownloadSettingsRepositoryInterface:
        alias: App\Repository\DownloadSettingsRepository
    App\Repository\DownloadMetricRepositoryInterface:
        alias: App\Repository\DownloadMetricRepository
    App\Repository\RefreshTokenRepositoryInterface:
        alias: App\Repository\RefreshTokenRepository
    App\Repository\AuditEventRepositoryInterface:
        alias: App\Repository\AuditEventRepository

    # A separate yt-dlp client with a short timeout for the synchronous Telegram probe.
    app.telegram.probe_yt_dlp_client:
        class: P3s\YtDlp\YtDlpClient
        arguments:
            $binaryPath: '%yt_dlp.binary_path%'
            $defaultArguments: '%yt_dlp.default_arguments%'
            $workingDirectory: '%yt_dlp.working_directory%'
            $timeout: 20
            $environment: '%yt_dlp.environment%'

    App\Service\YoutubeDlProbe:
        arguments:
            $ytDlpProbeClient: '@app.telegram.probe_yt_dlp_client'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    gedmo.mapping.driver.attribute:
        class: Gedmo\Mapping\Driver\AttributeReader

    # Timestampable
    gedmo.listener.timestampable:
        class: Gedmo\Timestampable\TimestampableListener
        tags:
            - { name: doctrine.event_listener, event: 'prePersist' }
            - { name: doctrine.event_listener, event: 'onFlush' }
            - { name: doctrine.event_listener, event: 'loadClassMetadata' }
        calls:
            - [ setAnnotationReader, [ "@gedmo.mapping.driver.attribute" ] ]
            - [ setClock, [ '@clock' ] ]

    # SoftDeleteable
    gedmo.listener.softdeleteable:
        class: Gedmo\SoftDeleteable\SoftDeleteableListener
        tags:
            - { name: doctrine.event_listener, event: 'onFlush' }
            - { name: doctrine.event_listener, event: 'loadClassMetadata' }
        calls:
            - [ setAnnotationReader, [ "@gedmo.mapping.driver.attribute" ] ]
            - [ setClock, [ '@clock' ] ]

    # Redis for sessions (database 1)
    redis.session:
        class: Redis
        factory: ['@App\Redis\RedisConnectionFactory', 'create']
        calls:
            - select: [1]

    # Session handler for Redis
    session.handler.redis:
        class: Symfony\Component\HttpFoundation\Session\Storage\Handler\RedisSessionHandler
        arguments:
            - '@redis.session'
