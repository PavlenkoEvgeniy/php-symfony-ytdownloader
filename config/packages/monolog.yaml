monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - developers  # Dedicated developers channel

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                channels: ['!deprecation', '!developers']
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                level: '%env(MONOLOG_LEVEL)%'
            developers:
                type: stream
                channels: ['developers']
                path: '%kernel.logs_dir%/%kernel.environment%.developers.log'
                level: '%env(MONOLOG_DEVELOPERS_LEVEL)%'
            deprecation:
                type: stream
                channels: ['deprecation']
                path: '%kernel.logs_dir%/%kernel.environment%.deprecated.log'
                level: info
            console:
                type: console
                process_psr_3_messages: false
                channels: ['!event', '!doctrine']
                level: '%env(MONOLOG_LEVEL)%'

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ['!event']
            nested:
                type: stream
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                level: debug

when@prod:
    monolog:
        handlers:
            # Docker captures stderr in `docker logs`; the container has no
            # syslog daemon, so the old syslog handler silently dropped errors.
            main:
                type: stream
                channels: ['!deprecation', '!developers']
                path: 'php://stderr'
                formatter: monolog.formatter.loggly
                level: '%env(MONOLOG_LEVEL)%'
            developers:
                type: stream
                channels: ['developers']
                path: 'php://stderr'
                formatter: monolog.formatter.loggly
                level: '%env(MONOLOG_DEVELOPERS_LEVEL)%'
            deprecation:
                type: stream
                channels: ['deprecation']
                path: php://stderr
                formatter: monolog.formatter.loggly
                level: info
            console:
                type: console
                process_psr_3_messages: false
                channels: ['!event', '!doctrine']
                level: '%env(MONOLOG_LEVEL)%'
