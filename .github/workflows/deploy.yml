name: Deploy

on:
  push:
    tags: [ 'v*' ]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/lint-and-test.yml
    permissions:
      contents: read
      packages: write

  deploy:
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_VPS_HOST }}
          username: ${{ secrets.SSH_VPS_USERNAME }}
          password: ${{ secrets.SSH_VPS_PASSWORD }}
          script: |
            cd ${{ secrets.SSH_PROJECT_PATH }}
            make stop
            git stash
            git fetch origin --tags --force
            git checkout --detach --force ${{ github.ref_name }}
            make build
            make restart
            make composer-install
            docker exec ytdownloader-php-fpm php bin/console doctrine:migrations:migrate --no-interaction
            make cache-clear
            make cache-purge
            docker system prune --all --force