name: Deploy

on:
  push:
    tags: [ 'v*' ]
  # Lets a failed deploy be re-run for the same tag (workflow_dispatch input)
  # without creating a new version tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (defaults to github.ref_name)'
        required: false
        type: string

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/lint-and-test.yml
    permissions:
      contents: read
      packages: write

  deploy:
    runs-on: ubuntu-latest
    needs: checks
    # The release step below creates a GitHub release with the workflow token.
    permissions:
      contents: write
    # GHCR_TOKEN and APP_DOMAIN must be mapped explicitly; ssh-action forwards only
    # existing env vars. APP_DOMAIN stays out of the repository (public hostname).
    env:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      APP_DOMAIN: ${{ secrets.APP_DOMAIN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_VPS_HOST }}
          username: ${{ secrets.SSH_VPS_USERNAME }}
          password: ${{ secrets.SSH_VPS_PASSWORD }}
          # Fail fast instead of reporting a half-deployed stack as success.
          script_stop: true
          # Image pull replaces the local build; allow a few minutes.
          command_timeout: 20m
          # GHCR_TOKEN and APP_DOMAIN are provided by the job-level env mapping above.
          envs: GHCR_TOKEN,APP_DOMAIN
          script: |
            cd ${{ secrets.SSH_PROJECT_PATH }}
            export DOCKER_COMPOSE_FILES="docker/docker-compose.yml docker/docker-compose.prod.yml"
            # Caddy needs the public hostname; Docker Compose takes it from the shell.
            export APP_DOMAIN="${APP_DOMAIN:?APP_DOMAIN secret is not set}"
            # workflow_dispatch: GITHUB_SHA is the branch head, so resolve the tag commit.
            export DEPLOY_TAG="${{ inputs.tag || github.ref_name }}"
            git stash
            git fetch origin --tags --force
            # Checkout before stop: the new Makefile may need the prod compose file.
            git checkout --detach --force "$DEPLOY_TAG"
            # Image tag must match the checked-out commit that lint-and-test built.
            export PHP_FPM_IMAGE_TAG="ci-$(git rev-parse HEAD)"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            # Pull while the old stack runs to limit downtime.
            make pull
            # Start a stopped stack before composer/migrations; wait for Postgres.
            if ! docker inspect -f '{{.State.Running}}' ytdownloader-php-fpm 2>/dev/null | grep -q true; then
              make docker-compose-up
              docker exec ytdownloader-pgsql sh -c 'for i in $(seq 1 30); do pg_isready -U "$POSTGRES_USER" >/dev/null 2>&1 && exit 0; sleep 1; done; exit 1'
            fi
            # Install/migrate in the old container so workers start with the new code.
            make composer-install
            docker exec ytdownloader-php-fpm php bin/console asset-map:compile
            docker exec ytdownloader-php-fpm php bin/console doctrine:migrations:migrate --no-interaction
            make stop
            # Only safe while the stack is stopped (see the Makefile cache-purge comment).
            make cache-purge
            make restart
            # Remove old images, stopped containers and build cache; volumes are kept.
            make docker-prune

      # Runs only after a successful deploy from a tag push, so a failed deploy
      # never leaves a published release behind. Idempotent: a re-run (or a
      # release created manually) is left untouched.
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"

          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists, skipping."
            exit 0
          fi

          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "Release version ${tag#v}" \
            --generate-notes \
            --verify-tag
