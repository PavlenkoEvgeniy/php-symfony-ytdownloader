name: diag-settings

on:
    workflow_dispatch:

jobs:
    diag:
        runs-on: ubuntu-latest
        steps:
            - name: Read production diagnostics
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SSH_VPS_HOST }}
                  username: ${{ secrets.SSH_VPS_USERNAME }}
                  password: ${{ secrets.SSH_VPS_PASSWORD }}
                  script_stop: false
                  script: |
                      cd ${{ secrets.SSH_PROJECT_PATH }}
                      echo "=== PHP-FPM LOG ==="
                      docker logs ytdownloader-php-fpm --tail 3000 2>&1 | grep -E 'Fatal|Uncaught|PHP message|Twig|settings|CRITICAL' | tail -30 | cut -c1-800
                      echo "=== NGINX ACCESS (settings) ==="
                      docker exec ytdownloader-webserver sh -c 'tail -n 3000 /var/log/nginx/application.access.log 2>/dev/null | grep "/admin/settings" | tail -10' 2>&1 | cut -c1-400
                      echo "=== NGINX ERROR ==="
                      docker exec ytdownloader-webserver sh -c 'tail -n 100 /var/log/nginx/error.log 2>/dev/null' 2>&1 | cut -c1-800
                      echo "=== PHP ERROR LOG (webserver) ==="
                      docker exec ytdownloader-webserver sh -c 'tail -n 100 /var/log/nginx/application_php_errors.log 2>/dev/null' 2>&1 | cut -c1-800
                      echo "=== PHP ERROR LOG (php-fpm) ==="
                      docker exec ytdownloader-php-fpm sh -c 'tail -n 100 /var/log/nginx/application_php_errors.log 2>/dev/null' 2>&1 | cut -c1-800
