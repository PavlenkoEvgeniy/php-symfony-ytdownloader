name: diag-settings

on:
    workflow_dispatch:

jobs:
    diag:
        runs-on: ubuntu-latest
        steps:
            - name: Read production diagnostics
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SSH_VPS_HOST }}
                  username: ${{ secrets.SSH_VPS_USERNAME }}
                  password: ${{ secrets.SSH_VPS_PASSWORD }}
                  script_stop: false
                  script: |
                      cd ${{ secrets.SSH_PROJECT_PATH }}
                      echo "=== VERSION ==="
                      git describe --tags --always
                      echo "=== SETTINGS ROW ==="
                      docker exec ytdownloader-pgsql sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT id, web_intake_enabled, progress_interval_minutes FROM download_settings;"' 2>&1 | head -5
                      echo "=== PROD LOG (last errors) ==="
                      docker exec ytdownloader-php-fpm sh -c 'grep -E "CRITICAL|ERROR|Uncaught" /application/var/log/prod.log | tail -5' 2>&1 | sed -E 's#https?://[^ "]+#<url>#g; s#[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+#<email>#g' | cut -c1-600
                      echo "=== CONTAINER LOG (last errors) ==="
                      docker logs ytdownloader-php-fpm --tail 300 2>&1 | grep -Ei 'fatal|error|exception|settings' | tail -10 | cut -c1-600
