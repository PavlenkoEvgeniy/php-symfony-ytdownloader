; Hourly deletion of orphan files in the downloads directory. The first run
; retries while Postgres starts; the quiet flag keeps an empty run out of the
; container logs.
[program:downloads-prune]
command=/bin/sh -c 'for i in $(seq 1 30); do php /application/bin/console app:downloads:prune --no-interaction --quiet && break; sleep 2; done; while true; do sleep 3600; php /application/bin/console app:downloads:prune --no-interaction --quiet; done'
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=0
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
