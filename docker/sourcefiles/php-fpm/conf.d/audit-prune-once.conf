; One-shot audit retention at container start; runs as www-data so the cache it
; builds is writable, and retries while Postgres starts.
[program:audit-prune-once]
command=/bin/sh -c 'for i in $(seq 1 30); do php /application/bin/console app:audit:prune --days=180 && exit 0; sleep 2; done; exit 1'
user=www-data
numprocs=1
autostart=true
autorestart=false
startsecs=0
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
