;/etc/supervisor/conf.d/telegram-commands-once.conf
; One-shot registration of the bot command menu at container start, so the menu
; appears in Telegram without a manual hook call; retries brief API failures.
; The command exits at once when the bot is disabled.
[program:telegram-commands-once]
command=/bin/sh -c 'for i in $(seq 1 5); do php /application/bin/console app:telegram-commands --no-interaction && exit 0; sleep 5; done; exit 1'
user=www-data
numprocs=1
autostart=true
autorestart=false
startsecs=0
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
