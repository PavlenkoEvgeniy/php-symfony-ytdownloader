;/etc/supervisor/conf.d/php-fpm.conf
[program:php-fpm]
command=php-fpm
autostart=true
autorestart=true
; QUIT = graceful shutdown of the php-fpm master
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0