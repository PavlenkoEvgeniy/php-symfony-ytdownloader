;/etc/supervisor/conf.d/queue-reset-once.conf
; One-shot queue reset at container start (once per container, not per worker):
; tasks left behind by a worker that died mid-task go back to queued and
; messages the dead worker never acked become deliverable again (see
; QueueResetService / app:task:reset-stuck). Postgres may not be ready yet
; when supervisord starts, hence the bounded retry loop.
[program:queue-reset-once]
command=/bin/sh -c 'for i in $(seq 1 30); do php /application/bin/console app:task:reset-stuck && exit 0; sleep 2; done; exit 1'
user=root
numprocs=1
autostart=true
autorestart=false
startsecs=0
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0