;/etc/supervisor/conf.d/telegram-poll.conf
; Polls the Bot API server for updates, so the bot keeps answering even when
; cloud webhook delivery degrades. Feeds the same deduplicated pipeline as the
; webhook, so both paths may run together.
[program:telegram-poll]
; Exits at once where no Bot API server exists (CI sets TELEGRAM_POLL_ENABLED=false).
command=/bin/sh -c 'if [ "$TELEGRAM_POLL_ENABLED" = "false" ]; then exit 0; fi; exec php /application/bin/console app:telegram-poll --no-interaction'
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
