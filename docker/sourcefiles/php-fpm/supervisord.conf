; The Alpine supervisor package includes /etc/supervisor.d/*.ini by default.
; The compose stack mounts the program files at /etc/supervisor/conf.d, so this
; config is shipped by the image to keep the same mount path as the Debian image.
[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
childlogdir=/tmp
nodaemon=true
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
