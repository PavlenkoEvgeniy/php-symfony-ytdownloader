# Production override: pull php-fpm from GHCR (ADR-0005) and terminate TLS in
# Caddy (ADR-0007); set PHP_FPM_IMAGE_TAG and APP_DOMAIN.
services:
    php-fpm:
        image: ghcr.io/pavlenkoevgeniy/php-symfony-ytdownloader/php-fpm:${PHP_FPM_IMAGE_TAG:?required}
        pull_policy: always

    webserver:
        # Caddy owns host ports 80/443 (ADR-0007); reset the base compose binding so
        # nginx stays reachable only on the Docker network.
        ports: !reset []

    telegram-bot-api:
        # Local Bot API server: raises the file upload limit to 2000 MB and keeps
        # the bot token traffic inside the Docker network.
        image: aiogram/telegram-bot-api:latest
        container_name: ${PROJECT_NAME:-ytdownloader}-telegram-bot-api
        restart: always
        environment:
            TELEGRAM_API_ID: ${TELEGRAM_API_ID:?TELEGRAM_API_ID is required}
            TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?TELEGRAM_API_HASH is required}
            TELEGRAM_LOCAL: '1'
        volumes:
            - telegram-bot-api-data:/var/lib/telegram-bot-api
        networks:
            - internal

    caddy:
        image: caddy:2-alpine
        container_name: ${PROJECT_NAME:-ytdownloader}-caddy
        restart: always
        environment:
            APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
        ports:
            - 80:80
            - 443:443
        volumes:
            - ./sourcefiles/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy-data:/data
            - caddy-config:/config
        depends_on:
            - webserver
        networks:
            - internal

volumes:
    caddy-data:
        driver: local
    caddy-config:
        driver: local
    telegram-bot-api-data:
        driver: local
