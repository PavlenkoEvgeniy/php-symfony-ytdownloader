name: ${PROJECT_NAME:-ytdownloader}

services:
    webserver:
        image: nginx:alpine
        container_name: ${PROJECT_NAME}-webserver
        env_file:
            - .env
        restart: always
        working_dir: /application
        networks:
            - internal
        volumes:
            - ./../:/application
            - ./sourcefiles/nginx:/etc/nginx/conf.d
        # Loopback for local development; the production override resets this binding
        # and publishes 80/443 through Caddy instead (ADR-0007).
        ports:
            - 127.0.0.1:${NGINX_PORT}:80

    php-fpm:
        build:
            context: sourcefiles/php-fpm
            args:
                XDEBUG_INSTALL: ${XDEBUG_INSTALL:-false}
        container_name: ${PROJECT_NAME}-php-fpm
        restart: always
        env_file:
            - .env
        depends_on:
            - pgsql
            - redis
        working_dir: /application
        volumes:
            - ./../:/application
            - ./sourcefiles/php-fpm/php-ini-overrides.ini:/usr/local/etc/php/conf.d/99-overrides.ini
            - ./sourcefiles/php-fpm/conf.d:/etc/supervisor/conf.d:ro
        networks:
            - internal
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            - PHP_WORKER_INSTALL_BCMATH=true
            - XDEBUG_MODE=${XDEBUG_MODE:-off}
            - XDEBUG_CLIENT_HOST=${XDEBUG_CLIENT_HOST:-host.docker.internal}
            - XDEBUG_CLIENT_PORT=${XDEBUG_CLIENT_PORT:-9003}
            - XDEBUG_CONFIG=client_host=${XDEBUG_CLIENT_HOST:-host.docker.internal} client_port=${XDEBUG_CLIENT_PORT:-9003}
            - PHP_IDE_CONFIG=serverName=Docker

    pgsql:
        image: postgres:16-alpine
        container_name: ${PROJECT_NAME}-pgsql
        env_file:
            - .env
        restart: always
        environment:
            PGPASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - ./../database:/var/lib/postgresql/data
        # Loopback only: the app connects over the Docker network; host access is
        # for local tools and SSH tunnels.
        ports:
            - 127.0.0.1:${DB_PORT}:5432
        networks:
            - internal

    redis:
        image: redis:7-alpine
        container_name: ${PROJECT_NAME}-redis
        restart: always
        command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
        volumes:
            - redis-data:/data
        # Loopback only, same as PostgreSQL.
        ports:
            - 127.0.0.1:${REDIS_PORT}:6379
        networks:
            - internal

volumes:
    redis-data:
        driver: local

networks:
    internal:
        driver: bridge
